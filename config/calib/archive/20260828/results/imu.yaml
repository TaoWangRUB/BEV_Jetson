# MPU-9250 (onboard the J106) for Kalibr / quarterKalibr camera-IMU calibration.
#
# PROVENANCE: these are DATASHEET figures, not an Allan-variance measurement of this
# part. Recorded that way deliberately — a made-up number that looks measured is worse
# than a stated approximation.
#
#   gyroscope_noise_density    datasheet rate noise spectral density 0.01 deg/s/sqrt(Hz)
#                              = 0.01 * pi/180 = 1.75e-4 rad/s/sqrt(Hz)
#   accelerometer_noise_density  datasheet 300 ug/sqrt(Hz) = 300e-6 * 9.80665
#                              = 2.94e-3 m/s^2/sqrt(Hz)
#   *_random_walk              NOT in the datasheet. These are typical consumer-MEMS
#                              values and are the least trustworthy numbers here.
#
# Kalibr converges more reliably with slightly pessimistic noise, so these are not
# scaled down. If Delta or the VIO turns out sensitive to them, measure properly: a
# multi-hour static recording and an Allan deviation. That is a real experiment, not a
# config change, which is why it is not done pre-emptively.
#
# The reader is `bev_imu/imu_node`: samples are stamped at the DATA-READY EDGE on
# CLOCK_MONOTONIC, the same clock as the cameras (README 4.7). Group delays from the
# DLPF are reported by the node and NOT applied — at the configured bandwidths the gyro
# lags the accel by ~1.02 ms, which no single correction can fix.

#Accelerometer
accelerometer_noise_density: 0.0029      # m/s^2/sqrt(Hz)
accelerometer_random_walk:   0.00086     # m/s^3/sqrt(Hz)  (typical, unmeasured)

#Gyroscope
gyroscope_noise_density:     0.000175    # rad/s/sqrt(Hz)
gyroscope_random_walk:       0.000022    # rad/s^2/sqrt(Hz)  (typical, unmeasured)

rostopic:    '/imu0'
update_rate: 200.0                       # matches imu_node's default rate parameter
