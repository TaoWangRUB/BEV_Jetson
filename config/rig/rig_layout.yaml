# Physical layout of the BEV rig: where each camera is, which way the modules face, and
# how the IMU's axes sit relative to the vehicle. This is the reference a calibration
# result is CHECKED against — a gross axis swap or a dropped 180-degree roll produces
# numbers that still look plausible, so there has to be something to compare them with.
#
# TWO FRAMES, AND THEY ARE NOT THE SAME ONE. This file previously called the FLU frame
# "rig", and so does cuVSLAM — for a different frame. Disambiguated 2026-09-01 (3R.16b)
# before anything composed the two and got a silently-wrong answer:
#
#   body  — FLU: x forward, y left, z up. The vehicle frame. Everything in THIS file is
#           expressed in it, and it is what ROS means by base_link.
#   rig   — cuVSLAM's word, used in rig_extrinsics_imx296.yaml (`rig_in_cam1`) and in
#           cuvslam_multicam_node. It is CAM1'S OPTICAL FRAME: z forward along cam1's
#           optical axis, x right, y down, and additionally rolled 180 deg by the
#           inverted mount. It is not FLU and it is not the vehicle.
#
# MISSING, and the reason the VO node cannot publish a true base_link: there is no
# numeric rotation here from body to cam1. `position: front_left` is a label, not a
# rotation. Deriving one from the nominal layout would assume cam1 looks 45 deg off
# forward and is level — and this rig has already produced a camera ~19 deg off its
# nominal mount, so that assumption is exactly the kind this file exists to catch.
# Until R_body_from_cam1 is MEASURED, the VO node names its output frame
# cam1_optical_frame rather than base_link. See 3R.16b.

cameras:
  # port -> where it physically points. The ROS cam names follow the ports in
  # alphabetical order, which is NOT the order they sit in around the rig.
  cam1: {port: c, position: front_left,  i2c: 2-001a}
  cam2: {port: d, position: front_right, i2c: 2-0018}
  cam3: {port: e, position: back_left,   i2c: 7-001a}
  cam4: {port: f, position: back_right,  i2c: 7-0018}

# ADJACENCY. Walking the rig, the neighbours are front_left -> front_right ->
# back_right -> back_left -> back to front_left, i.e. ports c, d, f, e. Note e and d
# are DIAGONAL, not adjacent: any pairwise calibration that walks cam1..cam4 in name
# order would try to solve a diagonal pair as if it were a stereo baseline, and the
# overlap it needs does not exist.
ring_order: [cam1, cam2, cam4, cam3]     # c (FL) -> d (FR) -> f (BR) -> e (BL)

# RE-VERIFIED 2026-08-31, after the cameras were reconnected and the lenses refocused.
# Checked from the images rather than from boot order, because a reconnect is exactly what
# can swap two ribbons while every software-visible mapping stays put:
#   - the nappy box sits at cam1's RIGHT edge and cam2's LEFT edge  (the FL/FR overlap)
#   - the rover wheel sits at cam1's LEFT edge and cam3's RIGHT edge (the FL/BL overlap)
# So the ring order below holds and no pair is swapped. A swap would have the pairwise
# calibration solving a DIAGONAL pair as if it were a stereo baseline.
#
# NOT established, and per the operator probably NOT true: that the physical module on a
# given port is the one that was there before. Intrinsics belong to the module, so no
# per-camera intrinsic from before 2026-08-31 may be carried across a port here.

# The modules are mounted INVERTED, so raw images are upside-down. Confirmed on the
# hardware 2026-08-28, and RE-CONFIRMED 2026-08-31 after the reconnect by the only
# unambiguous test: printed text. As captured, the text on the box in view reads
# upside-down and the floor is at the TOP of the frame; both come right after a 180
# rotation. Do not re-derive this from "which way up does the scene look" - that
# inference was made once here and was wrong.
#
# The capture path rotates 180 on the ISP (csi_sender FLIP=2), and the roll is folded into
# rig_extrinsics_vo.yaml rather than applied as a hidden extra step somewhere downstream.
camera_roll_deg: 180

imu:
  model: MPU-9250
  # MEASURED 2026-08-28 by TWO independent methods that agree. Nothing documents this:
  # neither the J106 README nor imu-mpu9250.dtsi states the mounting, and the datasheet
  # gives axes only relative to package pin 1. Tool: scripts/imu/axis_check.py.
  #
  # 1. Translation (72 s, rig slid front/back, left/right, up/down):
  #      front -> +y (burst spread 0.78 m/s^2 vs 0.30/0.27), left -> +x (1.38 vs
  #      0.44/0.38), up -> -z (1.17 vs 0.35/0.29).
  # 2. Held tilt poses (65 s, level / nose-up / left-side-up, repeated) — the stronger
  #    method, since gravity is 10.4 m/s^2 of noise-free signal against ~1 m/s^2 from a
  #    hand-pushed slide. Solved as a rotation rather than three labels:
  #      rig front -> IMU +y (1.5 deg off the axis)
  #      rig left  -> IMU +x (3.9 deg off)
  #      rig up    -> IMU -z (3.7 deg off),  det = +1.000
  #
  # PRECISION: the hand-held poses were not perpendicular to each other (front^left came
  # out 77.8 deg, and orthonormalising moved the frame 6.1 deg; repeated nose-up poses
  # agreed to 8.9 deg). So this fixes the axis LABELS AND SIGNS to within a few degrees.
  # It is NOT a calibration - the precise rotation comes from kalibr_calibrate_imu_camera,
  # and this is what that result gets checked against.
  #
  # RECORD THE POSE LABELS AT THE TIME - the numbers alone are ambiguous by construction.
  # Raising IMU +x by pivoting about IMU +y is geometrically identical for "nose-up, so
  # front is +x" and "left-side-up, so left is +x", and the gyro during the transition
  # cannot separate them either (checked). Only knowing which motion was performed does.
  # Here that came from the operator and from the translation test, which agree.
  #
  # Cross-checks: front x left = -z = up (right-handed), determinant +1 (a rotation, not
  # a reflection), and gravity at rest agrees with the tilt solve on the up axis. The
  # IMU's +z pointing down matches the whole board being mounted inverted, as the
  # cameras are.
  axes:
    body_front: +y
    body_left:  +x
    body_up:    -z
  # Rotation taking a vector in body(FLU) coordinates to IMU coordinates: swap x/y and
  # flip z, i.e. 180 degrees about (1,1,0)/sqrt(2).
  # RENAMED 2026-09-01 from R_imu_from_rig. The old name read as "from cuVSLAM's rig
  # frame", which is cam1 optical — composing it that way would have been wrong by the
  # optical->FLU convention and the 180 deg mount roll, and would have looked plausible.
  # Only scripts/imu/axis_check.py touches this key; renamed there too.
  R_imu_from_body: [[0, 1, 0],
                    [1, 0, 0],
                    [0, 0, -1]]
  # At rest |a| = 10.46 m/s^2, 6.7% above 1 g. That is the part's uncalibrated zero-g
  # offset (+-60 mg typical) and is exactly what a VIO/Kalibr calibration estimates —
  # it is NOT a clean gravity reference. Gyro bias at rest ~0.013 rad/s per axis.
