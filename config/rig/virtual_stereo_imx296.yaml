    - [np.float64(0.99725), np.float64(-0.074176), np.float64(-0.00475)]
    - [np.float64(0.074034), np.float64(0.997), np.float64(-0.024254)]
    - [np.float64(0.00655), np.float64(0.023829), np.float64(0.99975)]
  t_virtual: [np.float64(-0.148563), np.float64(-0.0034), np.float64(-0.004455)]
  quality:                            # measured on AprilTag IDENTITY after rectification
    correspondences: 2944
    epipolar_dy_median_px: 1.63
    epipolar_dy_p90_px: 5.79
    epipolar_dy_rms_px: 3.3
    epipolar_dy_signed_median_px: 1.14
    disparity_sign_consistency: 1.0   # every correspondence shifts the same way

right:
  from: cam2          # contributes its +45 deg virtual pinhole
  to: cam4            # contributes its -45 deg virtual pinhole
  axes_apart_deg: 2.1
  baseline_m: 0.1491
  R_virtual:                          # virtual-A -> virtual-B
    - [np.float64(0.9939), np.float64(-0.10451), np.float64(-0.0358)]
    - [np.float64(0.104864), np.float64(0.9945), np.float64(0.007425)]
