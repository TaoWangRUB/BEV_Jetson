# Virtual pinhole stereo pairs for the 4x IMX296 rig, generated 2026-08-29.
#
# WHY THIS EXISTS. The lenses are ~192 deg diagonal. cuVSLAM's only fisheye model is the
# equidistant one, which cannot represent rays past 90 deg incidence, so it cannot
# consume these cameras at all. Each fisheye is carved into two virtual pinholes aimed
# +-45 deg; the one facing the neighbour forms a stereo pair with it. cuVSLAM then sees
# plain Pinhole images with zero distortion - and the pair's frusta overlap almost
# completely, clearing the hard-coded 0.5 frustum-overlap gate that rejected the raw rig.
#
# Method follows OmniNxt/quarterKalibr's fisheye_undist.py: focal = W/2/tan(fov_pin/2)
# and a BACKWARD remap - for each virtual pixel, form its ray, project it through the
# calibrated omni model, record the source fisheye pixel.
#
# THE SPLIT USES THE HORIZONTAL FIELD, NOT THE DIAGONAL. The lens is D190 / H160 and the
# pinholes are carved by YAW, so the horizontal 160 deg governs. Generated at fov=190,
# each pinhole reaches 95 deg off-axis where the lens delivers 80, and every rectified
# view came back with a large black wedge - 90% non-black at fov=190 against 100% here.
#
# RESOLUTION IS NOT FREE. focal 548.4 px is 1.03x the fisheye's near-axis scale of
# 534 px/rad. At 480x360 the virtual focal is 201 px (0.38x) and AprilTag detection
# collapsed from ~10 tags/frame to 0.1, which produced a NaN in Kalibr's second camera
# before the cause was understood.
#
# WHICH pinhole faces which is derived from the extrinsic (smallest angle between virtual
# optical axes), not assumed - see axes_apart_deg.
#
# BUILT ON THE RING-CLOSED RIG. These pairs come from the closed extrinsics, not the raw
# pairwise solves - see rig_extrinsics_imx296.yaml. Closure moved each pair by 0.57-1.31
# deg and the epipolar residuals below are measured after that, so left and rear improved
# (0.81 -> 0.45, 0.83 -> 0.66) while front and right got worse (1.42 -> 1.79, 0.62 -> 2.55).
# The mean cost is ~4% in rms, paid to make the four pairs describe one rigid body.

virtual_pinhole:
  width: 768
  height: 576
  fov_deg: 70
  focal_px: 548.409
  principal_point: [384.0, 288.0]
  distortion: [0.0, 0.0, 0.0, 0.0]     # zero by construction

left:
  from: cam3
  to: cam1
  axes_apart_deg: 1.1
  baseline_m: 0.1471
  R_virtual:
    - [0.994249, -0.107687, -0.003052]
    - [0.107629, 0.994195, -0.013870]
    - [0.004471, 0.013480, 0.999806]
  t_virtual: [-0.146632, -0.011322, -0.004823]
  quality:                            # AprilTag IDENTITY, measured after ring closure
    epipolar_dy_median_px: 0.45
    epipolar_dy_p90_px: 4.91
    epipolar_dy_rms_px: 3.15
    epipolar_dy_signed_median_px: +0.16
    disparity_sign_consistency: 1.0
    dense_valid_fraction: 0.14

front:
  from: cam1
  to: cam2
  axes_apart_deg: 1.4
  baseline_m: 0.1488
  R_virtual:
    - [0.997297, -0.072746, 0.011824]
    - [0.073002, 0.997097, -0.023394]
    - [-0.010071, 0.024189, 0.999712]
  t_virtual: [-0.148729, -0.003751, -0.003801]
  quality:                            # AprilTag IDENTITY, measured after ring closure
    epipolar_dy_median_px: 1.79
    epipolar_dy_p90_px: 5.53
    epipolar_dy_rms_px: 3.15
    epipolar_dy_signed_median_px: +1.47
    disparity_sign_consistency: 1.0
    dense_valid_fraction: 0.19

right:
  from: cam2
  to: cam4
  axes_apart_deg: 1.1
  baseline_m: 0.1498
  R_virtual:
    - [0.994680, -0.103369, -0.013647]
    - [0.103579, 0.994660, 0.012740]
    - [0.012194, -0.014139, 0.999827]
  t_virtual: [-0.149456, -0.007819, -0.006038]
  quality:                            # AprilTag IDENTITY, measured after ring closure
    epipolar_dy_median_px: 2.55
    epipolar_dy_p90_px: 7.73
    epipolar_dy_rms_px: 4.07
    epipolar_dy_signed_median_px: -2.13
    disparity_sign_consistency: 1.0
    dense_valid_fraction: 0.14

rear:
  from: cam4
  to: cam3
  axes_apart_deg: 1.0
  baseline_m: 0.1490
  R_virtual:
    - [0.994782, -0.099667, 0.015897]
    - [0.100033, 0.995000, -0.018420]
    - [-0.013882, 0.019942, 0.999848]
  t_virtual: [-0.148647, -0.009589, -0.001399]
  quality:                            # AprilTag IDENTITY, measured after ring closure
    epipolar_dy_median_px: 0.66
    epipolar_dy_p90_px: 3.29
    epipolar_dy_rms_px: 1.88
    epipolar_dy_signed_median_px: -0.44
    disparity_sign_consistency: 1.0
    dense_valid_fraction: 0.22

quality_summary: >-
  Median epipolar residual 0.45-2.55 px across the four pairs after ring closure (0.62-1.42
  before), disparity sign consistent on 100% of correspondences, implied depths 0.32-0.44 m
  matching how the board was held. Usable, not excellent: a well-calibrated physical stereo
  rig reaches under 0.5 px, so disparity search needs a few pixels of vertical tolerance
  rather than a strict row.

  At focal 548 px one degree of rotation error is 9.6 px, so ~1 px is ~0.1 deg. The spread
  across pairs is now dominated by how the closure redistributed each recording's
  systematic bias, not by the rectification itself - right absorbed the largest correction
  (1.31 deg) and carries the largest residual. Improving this needs a recording where three
  or more cameras see the board at once, not a different rectification.

  These numbers come from tag IDENTITY, not descriptor matching. ORB on this repetitive
  indoor scene reported 4.15 px median with a 74 px p90, describing the matcher rather
  than the rig.

depth_note: >-
  Dense disparity was computed on these recordings and is NOT evidence either way. They
  are calibration sweeps: a repetitive tag grid filling the frame at 0.3-0.6 m against
  blank white wall and floor - close to the worst case for block matching. SGBM returned
  14-22% valid pixels with heavy speckle, and widening the search range made it worse, so
  the limit is texture rather than geometry. Where it did match, the ordering was correct
  (board near, doorway far) and depths agreed with how the board was held. Judging dense
  depth needs a textured scene at 1-3 m, which has not been recorded.
