  from: cam4          # contributes its +45 deg virtual pinhole
  to: cam3            # contributes its -45 deg virtual pinhole
  axes_apart_deg: 1.3
  baseline_m: 0.1491
  R_virtual:                          # virtual-A -> virtual-B
    - [np.float64(0.99455), np.float64(-0.10352), np.float64(0.00145)]
    - [np.float64(0.10352), np.float64(0.9944), np.float64(-0.022062)]
    - [np.float64(0.00085), np.float64(0.022062), np.float64(0.99975)]
  t_virtual: [np.float64(-0.148846), np.float64(-0.0092), np.float64(-0.000778)]
  quality:                            # measured on AprilTag IDENTITY after rectification
    correspondences: 3888
    epipolar_dy_median_px: 0.93
    epipolar_dy_p90_px: 4.25
    epipolar_dy_rms_px: 2.22
    epipolar_dy_signed_median_px: 0.65
    disparity_sign_consistency: 1.0   # every correspondence shifts the same way

quality_summary: >-
  Median epipolar residual 0.71-1.63 px across the four pairs, with disparity sign
  consistent on 100% of correspondences and implied depths 0.41-0.46 m matching how the
  board was actually held. Usable, not excellent: a well-calibrated physical stereo rig
  reaches under 0.5 px, so disparity search needs a vertical tolerance of a few pixels
  rather than a strict single row.

  The residual is consistent with the extrinsics that produced it. At focal 537 px, one
  degree of rotation error is 9.4 px, so ~1 px of epipolar error corresponds to ~0.1 deg
  - which sits inside the 0.55-0.68 deg angular spread each pairwise solve reported. The
  way to improve this is a better extrinsic (the ring closes at 4.75 deg, with the right
  pair the 92.2 deg outlier), not a different rectification.

  Feature-matcher-based measurement was tried first and is NOT the basis of these
  numbers: ORB on a repetitive indoor scene reported a 4.15 px median with a 74 px p90,
  which measured the matcher rather than the rig. Tag identity removes that ambiguity.
