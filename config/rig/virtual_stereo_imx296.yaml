quality_summary: >-
  Median epipolar residual 0.62-1.42 px across the four pairs, disparity sign consistent
  on 100% of correspondences, implied depths 0.41-0.46 m matching how the board was held.
  Usable, not excellent: a well-calibrated physical stereo rig reaches under 0.5 px, so
  disparity search needs a few pixels of vertical tolerance rather than a strict row.

  The residual is consistent with its inputs. At focal 548 px one degree of rotation
  error is 9.6 px, so ~1 px is ~0.1 deg - inside the 0.55-0.68 deg angular spread each
  pairwise solve reported. Improving this means a better extrinsic (the ring closes at
  4.75 deg, the right pair being the 92.2 deg outlier), not a different rectification.

  These numbers come from tag IDENTITY, not descriptor matching. ORB on this repetitive
  indoor scene reported 4.15 px median with a 74 px p90, describing the matcher rather
  than the rig.

depth_note: >-
  Dense disparity was computed on these recordings and is NOT evidence either way. They
  are calibration sweeps: a repetitive tag grid filling the frame at 0.3-0.6 m against
  blank white wall and floor - close to the worst case for block matching. SGBM returned
  9-16% valid pixels with heavy speckle, and widening the search range made it worse, so
  the limit is texture rather than geometry. Where it did match, the ordering was correct
  (board near, doorway far) and depths agreed with how the board was held. Judging dense
  depth needs a textured scene at 1-3 m, which has not been recorded.
