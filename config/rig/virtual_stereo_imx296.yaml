# Virtual pinhole stereo pairs for the 4x IMX296 rig, generated 2026-08-29.
#
# WHY THIS EXISTS. The lenses are ~192 deg. cuVSLAM's only fisheye model is the
# equidistant one, which cannot represent rays past 90 deg incidence, so it cannot
# consume these cameras at all. Each fisheye is therefore carved into two virtual
# pinholes aimed +-45 deg, each covering (fov - 90) = 100 deg, and the pinhole that
# faces the neighbour forms a stereo pair with it. cuVSLAM then sees plain Pinhole
# images with zero distortion - and the pair's frusta overlap almost completely, which
# also clears the hard-coded 0.5 frustum-overlap gate that rejected the raw rig.
#
# Method follows OmniNxt/quarterKalibr's fisheye_undist.py: focal = W/2/tan(fov_pin/2),
# and a BACKWARD remap - for each virtual pixel, form its ray, project it through the
# calibrated omni model, record the source fisheye pixel. The omni calibration is
# consumed here and does not appear downstream.
#
# RESOLUTION IS NOT FREE. focal 537.0 px is 1.00x the fisheye's near-axis scale of
# 534 px/rad, chosen deliberately: at 480x360 the virtual focal is 201 px (0.38x) and
# AprilTag detection collapsed from ~10 tags/frame to 0.1.
#
# WHICH pinhole faces which is derived from the measured extrinsic (smallest angle
# between virtual optical axes), not assumed - see the axes_apart_deg field.

virtual_pinhole:
  width: 1280
  height: 960
  fov_deg: 100
  focal_px: 537.0238
  principal_point: [640.0, 480.0]
  distortion: [0.0, 0.0, 0.0, 0.0]     # zero by construction
  note: >-
    Exact by construction - we define these cameras. Kalibr re-calibrating the generated
    images recovered f = 527.7 / 529.4 and centre 645.1 / 479.9 against the constructed
    537.0 and (640, 480); that 1.7% gap is a measure of residual undistortion error, not
    a correction to apply.

left:
  from: cam3          # contributes its +45 deg virtual pinhole
  to: cam1            # contributes its -45 deg virtual pinhole
  axes_apart_deg: 1.1
  baseline_m: 0.1478
  R_virtual:                          # virtual-A -> virtual-B
    - [np.float64(0.9938), np.float64(-0.111016), np.float64(-0.0124)]
    - [np.float64(0.110804), np.float64(0.9937), np.float64(-0.014637)]
    - [np.float64(0.014), np.float64(0.013152), np.float64(0.9998)]
  t_virtual: [np.float64(-0.14729), np.float64(-0.011), np.float64(-0.00502)]
  quality:                            # measured on AprilTag IDENTITY after rectification
    correspondences: 3996
    epipolar_dy_median_px: 0.87
    epipolar_dy_p90_px: 5.17
    epipolar_dy_rms_px: 3.05
    epipolar_dy_signed_median_px: -0.57
    disparity_sign_consistency: 1.0   # every correspondence shifts the same way

