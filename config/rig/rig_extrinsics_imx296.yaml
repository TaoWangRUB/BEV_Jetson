# Extrinsics for the 4x IMX296 rig, solved 2026-08-29, ring-closed 2026-08-29.
#
# Each pair was solved from its own recording with KALIBR's AprilGrid detector and pose
# estimate (GridDetector + observation.T_t_c) - reimplementing the board model by hand
# plateaued at 11 px residual and a metre of baseline error before that was abandoned.
#
# WHY THESE ARE CLOSED, AND WHAT IT COST.
# Four independent solves had nothing forcing them to agree. Composed around the ring
# cam1 -> cam2 -> cam4 -> cam3 -> cam1 they left 3.63 deg and 9.2 mm of residual: the rig
# they described was not rigid. cuVSLAM Multicamera carries features between pairs, so it
# would have been handed four sub-frustums disagreeing about where they sit - 3.63 deg is
# 35 px at the image edge, an order of magnitude past the rectification error.
#
# T_to_from below is the CLOSED rig (scripts/calib/close_rig_ring.py, Levenberg-Marquardt
# over three camera poses in cam1's frame, 18 dof instead of 24). T_to_from_measured keeps
# what each recording actually said. Loop residual is now 0.0000 deg / 0.043 mm.
#
# THIS DID NOT MAKE THE CALIBRATION MORE ACCURATE. A Monte-Carlo over each pair's reported
# spread says random per-pose error would leave only ~0.5 deg of loop residual, so the
# 3.63 deg was systematic bias inside each recording, and averaging biases redistributes
# rather than cancels them. Measured directly, per-pair epipolar residual after closure:
#
#            median |dy|        rms          <- open rig in brackets
#   left      0.45 px (0.81)   3.15 (3.08)
#   front     1.79 px (1.42)   3.15 (2.89)
#   right     2.55 px (0.62)   4.07 (3.83)
#   rear      0.66 px (0.83)   1.88 (1.95)
#   mean      1.36 px (0.92)   3.06 (2.94)
#
# So rigidity costs ~4% in rms and moves the error between pairs. That is the right trade
# against a 3.63 deg inconsistency, but it is a trade, not a free win.
#
# Weighting by each pair's MEASURED epipolar residual instead of its internal angular
# spread was tried and is worse (mean rms 3.45): it protects the best pair but pushes more
# translation onto the others. Pass a virtual_stereo yaml as argv[3] to reproduce it.
#
# THE REAL FIX is a recording where three or more cameras see the board simultaneously,
# which makes the per-recording bias observable instead of absorbed. More frames in the
# existing recordings will not help - averaging is already saturated.

left:            # cam3 expressed in cam1
  from: cam3
  to: cam1
  simultaneous_poses: 153
  angular_spread_deg: {median: 0.55, p90: 0.88}
  baseline_m: 0.1471
  baseline_measured_m: 0.1478
  closure_correction: {rot_deg: 0.57, t_mm: 0.76}
  epipolar_after_closure: {median_px: 0.45, p90_px: 4.91, rms_px: 3.15, signed_median_px: +0.16}
  T_to_from:
    - [-0.006540, -0.085678, -0.996318, -0.100274]
