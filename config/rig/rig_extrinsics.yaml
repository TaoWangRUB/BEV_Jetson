# cuVSLAM rig extrinsics — rig_from_<frame>, generated from physical layout.
# rig frame: TX2 board center; X=right(lateral) Y=forward(longitudinal) Z=up. units: metres.
# camera image-up = [0, 0, 1] (rig frame). translations in m, quaternions wxyz.
#
# Wiring: port b empty (6th cam not probing). /dev/video <-> port: a=video0 (unused),
# c=video1, d=video2, e=video3, f=video4. Only ports c,d,e,f are used = cam1,cam2,cam3,cam4.
# Argus sensor index == /dev/video index (confirmed by the panorama), so capture with:
#   sensor_ids = [1, 2, 3, 4]   paired with   cameras = [cam1, cam2, cam3, cam4]
#   (sensor1=video1=port c=cam1, s2=d=cam2, s3=e=cam3, s4=f=cam4).
# NOTE: sensor_ids=[0,1,2,3] is WRONG — sensor 0 = video0 = port a (uncalibrated, unused).
rig_frame: board_center
cameras:
  cam1:
    port: c
    forward: [0, -1, 0]
    t_xyz_m: [0.00000, -0.01500, 0.04000]
    q_wxyz: [0.000000, 0.000000, -0.707107, 0.707107]
  cam2:
    port: d
    forward: [-1, 0, 0]
    t_xyz_m: [-0.01500, 0.00000, 0.04000]
    q_wxyz: [0.500000, -0.500000, -0.500000, 0.500000]
  cam3:
    port: e
    forward: [0, 1, 0]
    t_xyz_m: [0.00000, 0.01500, 0.04000]
    q_wxyz: [0.707107, -0.707107, 0.000000, 0.000000]
  cam4:
    port: f
    forward: [1, 0, 0]
    t_xyz_m: [0.01500, 0.00000, 0.04000]
    q_wxyz: [-0.500000, 0.500000, -0.500000, 0.500000]
imu:
    t_xyz_m: [0.00265, 0.02750, 0.00000]
    q_wxyz: [1.0, 0.0, 0.0, 0.0]
