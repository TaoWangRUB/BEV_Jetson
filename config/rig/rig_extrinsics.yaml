# cuVSLAM rig extrinsics — rig_from_<frame>, generated from physical layout.
# rig frame: TX2 board center; X=right(lateral) Y=forward(longitudinal) Z=up. units: metres.
# camera image-up = [0, 0, 1] (rig frame). translations in m, quaternions wxyz.
#
# Wiring: port b empty (6th cam not probing). /dev/video -> port: a=video0, c=video1,
# d=video2, e=video3, f=video4. Calibrated cams are keyed to PORT: cam1=c cam2=d cam3=e cam4=f.
# Argus enumerates devices in order [a, f, d, e, c] (= getCameraDevices index 0..4; port a is
# the uncalibrated extra). So to capture cam1-4 (ports c,d,e,f) pair:
#   sensor_ids = [1, 2, 3, 4]  with  cameras = [cam1, cam2, cam3, cam4]  (video1-4 = ports c-f = cam1-4)
#   (Argus dev 4=port c=cam1, dev 2=d=cam2, dev 3=e=cam3, dev 1=f=cam4).
# NOTE: sensor_ids=[0,1,2,3] is WRONG — it grabs port a (uncalibrated) and misses port c.
rig_frame: board_center
cameras:
  cam1:
    port: c
    forward: [0, -1, 0]
    t_xyz_m: [0.00000, -0.01500, 0.04000]
    q_wxyz: [0.000000, 0.000000, -0.707107, 0.707107]
  cam2:
    port: d
    forward: [-1, 0, 0]
    t_xyz_m: [-0.01500, 0.00000, 0.04000]
    q_wxyz: [0.500000, -0.500000, -0.500000, 0.500000]
  cam3:
    port: e
    forward: [0, 1, 0]
    t_xyz_m: [0.00000, 0.01500, 0.04000]
    q_wxyz: [0.707107, -0.707107, 0.000000, 0.000000]
  cam4:
    port: f
    forward: [1, 0, 0]
    t_xyz_m: [0.01500, 0.00000, 0.04000]
    q_wxyz: [-0.500000, 0.500000, -0.500000, 0.500000]
imu:
    t_xyz_m: [0.00265, 0.02750, 0.00000]
    q_wxyz: [1.0, 0.0, 0.0, 0.0]
