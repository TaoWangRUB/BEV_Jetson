# Native (Rust) workspace of the BEV rig: the slam-rs VIO with the loop-closing backend,
# built against the pinned slam-rs submodule without modifying it.
#
#   cd rust && cargo build --release            # CPU lane
#   cd rust && cargo build --release --features gpu-wgpu   # CubeCL/wgpu frontend lane
#
# The submodule's own workspace patches cubecl-common from a prepared source tree
# (scripts/slamrs/build_slamrs.sh runs the preparation); this workspace points at the
# same tree, so run build_slamrs.sh once per checkout before building here.
[workspace]
resolver = "3"
members = ["slamrs-lc"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
slam-rs = { path = "../third_party/rerun-examples/packages/slam-rs/crates/slam-rs" }
nalgebra = "0.35"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
clap = { version = "4", features = ["derive"] }
memmap2 = "0.9"
thiserror = "2"

[patch.crates-io]
cubecl-common = { path = "../third_party/rerun-examples/packages/slam-rs/target/patch/cubecl-common-0.11.0-pre.3" }

[profile.dev]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
